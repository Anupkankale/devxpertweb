eyebrow: Giving back
title: Contributing to the community, no strings attached.
lead: Before the lab ships anything of its own, it gives back. These are the places I contribute time and code to the open web, freely.
note: This part matters to me most. I contribute to WordPress core and open source **without expecting anything back**, because the tools I build my work on were given to me the same way. The lab is my way of paying that forward.
